[project]
name = "kubemap"
version = "0.1.0"
description = "Cartographie locale et en direct de clusters Kubernetes"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6",
    "croniter>=2",
    "websockets>=17.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
desktop = ["pywebview[pyside6]>=6.1"]
packaging = ["pyinstaller>=6.16"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
